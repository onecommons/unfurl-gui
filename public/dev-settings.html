  <script>
      /*
       * Its own page because unfurl_gui must be false here --
       * experimental-settings-indicator reads it at module scope and the oc
       * barrel imports that module eagerly, so nothing later can flip it. On
       * the gallery page that flag would put every other component into fork
       * mode, which is not what ships.
       */
      window.gon = { unfurl_gui: false, home_project: 'dev-settings' }
    </script>
  <body class="gl-dark gl-dark-scope">
    <!-- the indicator measures the fork's navbar to place itself -->
    <div data-qa-selector="navbar" style="position: absolute; visibility: hidden">
      <div class="navbar-collapse collapse"></div>
    </div>
    <div id="dev-settings"></div>
  </body>
