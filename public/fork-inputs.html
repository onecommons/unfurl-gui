<!DOCTYPE html>
<html lang="en" class="gl-dark ui-neutral">
  <head>
  <script>
    /*
     * Colour mode, applied before paint so there is no flash of the wrong theme.
     *
     * 19.3 keys its design tokens off gl-dark / gl-light on <html>. ui-neutral is
     * the fork's default nav theme; it carries the teal tint in light and is a
     * no-op in dark -- all 1109 tokens resolve identically with and without it,
     * so it is set unconditionally.
     *
     * Defaults to dark, which is what standalone has always rendered. Following
     * prefers-color-scheme instead would silently flip every existing user, and
     * the screenshot baselines with them. The class on <html> is the no-JS
     * fallback; this only ever overrides it to light.
     */
    (function () {
      try {
        if (localStorage.getItem('oc-color-mode') === 'light') {
          document.documentElement.className = 'gl-light ui-neutral'
        }
      } catch (e) { /* private mode: keep the default */ }
    })()
  </script>

    <meta charset="utf-8">
    <title>fork-only inputs fixture</title>
    <style>
      .gallery { padding: 1rem 2rem; }
      .gallery-entry { margin-bottom: 2rem; padding: 1rem; border: 1px solid #4a4a52;
                       position: relative; min-height: 3rem; }
      .gallery-title { font: 600 13px/1.4 monospace; margin: 0 0 0.75rem; color: #89888d; }
      .gallery-error { color: #ec5941; white-space: pre-wrap; margin: 0; }
    </style>

    <!-- the same vendored GitLab stylesheets public/index.html links, so
         components here render the way they do in the app -->

  
    <link rel="stylesheet" href="/assets/application_dark.css">
  <link rel="stylesheet" href="/assets/tailwind.css">
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/assets/highlight-white.css">
  </head>

  <script>
      /*
       * Its own page because these four are fork-only, and unfurl_gui must be
       * false for them: fetchProjectInfo short-circuits to `{name}` when it is
       * true, which leaves registry_url deriving itself from an undefined
       * container_registry_image_prefix. On the gallery page that flag would
       * put every other component into fork mode, which is not what ships.
       */
      window.gon = {
        unfurl_gui: false,
        home_project: 'onecommons/blueprints/gallery',
        gitlab_url: 'https://gallery.test'
      }
    </script>
  <body>
    <div id="fork-inputs"></div>
  </body>
</html>
