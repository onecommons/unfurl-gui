name: Build, Test, Release

on: [push]

env:
  UNFURL_BRANCH: git-sync
  UNFURL_SERVER_IMAGE: ghcr.io/onecommons/unfurl:git-sync-server
  GCP_DNS_ZONE: deploythis.io
  AWS_DNS_ZONE: opencloudservices.net

  MAIL_USERNAME: admin@mailu.untrusted.me
  MAIL_PASSWORD: ocPC2cnGkQsz35I
  SMTP_HOST: mailu.untrusted.me

  AWS_ACCESS_KEY_ID: foobarbaz
  AWS_SECRET_ACCESS_KEY: asldfjkasldkjalqweioptuqpeortiu
  AWS_DEFAULT_REGION: eu-central-1

  ARM_CLIENT_ID: 2b03ea39-628d-4443-96ec-535bc8b374eb
  ARM_TENANT_ID: 1211e508-10ae-48e9-9591-74b82d108762
  ARM_SUBSCRIPTION_ID: 2a4d88e0-165e-422b-bb41-aa4f1461e581
  ARM_CLIENT_SECRET: asldfjkasldkjalqweioptuqpeortiu
  AZURE_RESOURCE_GROUP: example-resources
  AZURE_SUBNET: default
  AZURE_VIRTUAL_NETWORK: example-network

  GOOGLE_APPLICATION_CREDENTIALS: testing-shared/fixtures/service-account.json

  DIGITALOCEAN_TOKEN:  asldfjkasldkjalqweioptuqpeortiu

  FAIL_FAST_ENABLED: true
  CY_COMMAND_TIMEOUT: 30000
  TEST_VERSIONS: v2
  # Must stay declared at workflow level — the upload-artifact steps below
  # reference it via ${{ env.UNFURL_TEST_TMPDIR }}, which only reads YAML
  # env. (integration-test.js also defaults to "tmp" when unset, but that
  # only sets it for child processes, not GitHub Actions expressions.)
  UNFURL_TEST_TMPDIR: tmp

jobs:
  build_and_test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: git config
        run: git config --global user.email "you@example.com"; git config --global user.name "Your Name"
      - name: Install valkey
        run: |
            sudo apt-get update -y
            sudo apt install -y valkey
      - name: Install yarn dependencies
        run: npm i -g yarn && YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
        # TODO add back ufsv-patch -- --runInBand
      - name: Run unit tests
        run: yarn test packages -- --runInBand
      - name: Compile
        run: yarn build
      - name: Pull unfurl server image
        # The :<branch>-server image is built by unfurl's dev_images.yml and
        # bundles both the rust unfurl-server binary AND the optional Python
        # deps (redis, etc.) that a pipx install would skip.
        run: docker pull ${UNFURL_SERVER_IMAGE}
      # - name: Integration test
      #   run: yarn integration-test run --namespace onecommons/blueprints -- -e GENERATE_SUBDOMAINS=true --browser chrome -s cypress/e2e/blueprints/aws__baserow__baserow.cy.js
      - name: Integration test (unfurl init)
        env:
          CACHE_REDIS_URL: redis://localhost:6379/0
          # Shrink the rust proxy's batch-consolidation window from its 5-second
          # default to 1s so the unfurl-server jest tests' back-to-back updates
          # don't race the window (which would trip the worker's lock with a
          # "pending batch" rejection or a stale-queueid conflict against a
          # queue key that's still mid-batch). Tests still exercise the batch
          # path; they just don't wait 5s+ per round-trip.
          UNFURL_BATCH_WINDOW_SECS: '1'
          STANDALONE_SETUP_SCRIPT: testing-shared/unfurl-init-setup.sh
          # Runs the unfurl-server jest suite against the standalone gui
          # server before cypress. Tests live writes against the same
          # tmp/ufsv project that cypress is about to use.
          JEST_PRE_CYPRESS: packages/oc-pages/vue_shared/client_utils/unfurl-server.test.js
          # Cap the parent-walk for `unfurl init` and LocalEnv resolution
          # at $PWD/tmp so it doesn't ascend past tmp/ufsv into the
          # unfurl-gui checkout and adopt the gui repo's own _unfurl/
          # project as the parent — which leaves the ensemble created
          # under tmp/ufsv outside the resolved project's working dir
          # and crashes _apply_ensemble_patch with manifest.repo=None.
          # Must be absolute (path-equality check in _search_for_manifest_or_project).
        run: |
          mkdir -p ${{ env.UNFURL_TEST_TMPDIR }}
          export UNFURL_SEARCH_ROOT="$PWD/${{ env.UNFURL_TEST_TMPDIR }}"
          # HOME=/tmp + USER=unfurl + GIT_*_NAME/EMAIL avoid ansible and
          # git's identity-lookup crashes when --user overrides the image's
          # USER to a uid with no /etc/passwd entry (see unfurl-server.mjs
          # for the full explanation).
          export UNFURL_CMD="docker run --rm -v $PWD:$PWD -w $PWD --user $(id -u):$(id -g) -e HOME=/tmp -e USER=unfurl -e GIT_AUTHOR_NAME=unfurl -e GIT_AUTHOR_EMAIL=unfurl@example.com -e GIT_COMMITTER_NAME=unfurl -e GIT_COMMITTER_EMAIL=unfurl@example.com -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=init.defaultBranch -e GIT_CONFIG_VALUE_0=main -e UNFURL_HOME -e UNFURL_LOGGING -e UNFURL_NORUNTIME -e UNFURL_SKIP_SAVE -e UNFURL_SEARCH_ROOT -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION --entrypoint unfurl $UNFURL_SERVER_IMAGE"
          yarn integration-test run --namespace onecommons/blueprints -- -e GENERATE_SUBDOMAINS=true --browser chrome -s cypress/e2e/blueprints/aws__minecraft__minecraft.cy.js
      # - name: Integration test (staging upstream)
      #   run: yarn integration-test run --namespace onecommons/blueprints -- -e GENERATE_SUBDOMAINS=true --browser chrome -s cypress/e2e/blueprints/aws__baserow__baserow.cy.js
      #   env:
      #     OC_INVITE_CODE: ${{ secrets.OC_INVITE_CODE }}
      #     UNFURL_PACKAGE_RULES: 'gitlab.com/* staging.unfurl.cloud/* unfurl.cloud/* staging.unfurl.cloud/*'
      #     UNFURL_CLOUD_SERVER: https://staging.unfurl.cloud
      - name: Upload Cypress screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-screenshots
          path: cypress/screenshots
      - name: Upload dashboard
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard
          path: ${{ env.UNFURL_TEST_TMPDIR }}/ufsv
      - name: Upload unfurl server log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unfurl-server-log
          path: ${{ env.UNFURL_TEST_TMPDIR }}/unfurl.log
      - name: Create release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo ${{  github.ref_name }} > dist/RELEASE.txt
          tar -czvf unfurl-gui-dist.tar.gz dist
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unfurl-gui-dist
          path: unfurl-gui-dist.tar.gz
  # disable until dryrun tests are updated for local gui
  # dryrun:
  #   name: Trigger dryrun
  #   # avoid running twice when we're pushing a tag
  #   if: "!startsWith(github.ref, 'refs/tags/')"
  #   uses: ./.github/workflows/dryrun.yml
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: unfurl-gui-dist
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: unfurl-gui-dist.tar.gz
        # make_latest: "true"
        # draft: true
        # prerelease: true
